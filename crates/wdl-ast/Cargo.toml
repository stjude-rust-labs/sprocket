[package]
name = "wdl-ast"
version = "0.26.2"
description = "An abstract syntax tree for Workflow Description Language (WDL) documents"
authors.workspace = true
rust-version.workspace = true
edition.workspace = true
license.workspace = true
homepage.workspace = true
repository = "https://github.com/stjude-rust-labs/sprocket/tree/main/crates/wdl-ast"
documentation = "https://docs.rs/wdl-ast"

[features]
# Enables APIs related to Sprocket's Python bindings.
#
# This feature is not subject to `wdl-ast`'s semver guarantees. There may be breaking changes
# across patch versions. Use at your own risk.
unstable-python = ["dep:pyo3", "dep:sprocket-py-macros", "wdl-grammar/unstable-python"]

[dependencies]
macropol = { workspace = true }
paste = { workspace = true }
pyo3 = { workspace = true, optional = true }
rowan = { workspace = true }
sprocket-py-macros = { path = "../sprocket-py-macros", version = "0.1.0", optional = true }
url = { workspace = true }
urlencoding = { workspace = true }
wdl-grammar = { path = "../wdl-grammar", version = "0.25.1" }

[dev-dependencies]
approx = { workspace = true }
codespan-reporting = { workspace = true }
colored = { workspace = true }
pretty_assertions = { workspace = true }
rayon = { workspace = true }

[lints]
workspace = true
