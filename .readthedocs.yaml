version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
    rust: "latest"
  jobs:
    # Install `sprocket_bio` with the `docs` dependency group.
    install:
      - pip install --upgrade pip
      - pip install --group docs .

sphinx:
  builder: html
  configuration: python/docs/conf.py
  fail_on_warning: true
