name: Release Sprocket Python Bindings

permissions:
  contents: read

on:
  push:
    tags:
      - v*
  # When run on a pull request, this workflow will only build the wheels. It will not trigger a
  # release.
  pull_request:
    paths:
      - .github/workflows/python-release.yml
      - .python-version
      - Cargo.lock
      - Cargo.toml
      - crates/sprocket-py/**
      - crates/sprocket-py-macros/**
      - pyproject.toml
      - python/**
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to PyPI if true; only build artifacts if false
        required: true
        type: boolean
        default: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter --locked
          target: ${{ matrix.platform.target }}
          manylinux: auto

      - name: Upload wheels
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist
          if-no-files-found: error

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
          - runner: ubuntu-22.04
            target: aarch64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --find-interpreter --locked
          target: ${{ matrix.platform.target }}
          manylinux: musllinux_1_2

      - name: Upload wheels
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: actions/upload-artifact@v6
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist
          if-no-files-found: error

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: windows-latest
            target: x64
            python_arch: x64
            python_version: "3.10"
          - runner: windows-latest
            target: x64
            python_arch: x64
            python_version: "3.11"
          - runner: windows-latest
            target: x64
            python_arch: x64
            python_version: "3.12"
          - runner: windows-latest
            target: x64
            python_arch: x64
            python_version: "3.13"
          - runner: windows-latest
            target: x64
            python_arch: x64
            python_version: "3.14"
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
            python_version: "3.12"
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
            python_version: "3.13"
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
            python_version: "3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.platform.python_version }}
          # We need to specify the architecture, or it will download x64 Python on x86 builds.
          architecture: ${{ matrix.platform.python_arch }}

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter python --locked
          target: ${{ matrix.platform.target }}

      - name: Upload wheels
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.platform.target }}-py${{ matrix.platform.python_version }}
          path: dist
          if-no-files-found: error

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: macos-15-intel
            target: x86_64
            python_version: "3.10"
          - runner: macos-15-intel
            target: x86_64
            python_version: "3.11"
          - runner: macos-15-intel
            target: x86_64
            python_version: "3.12"
          - runner: macos-15-intel
            target: x86_64
            python_version: "3.13"
          - runner: macos-15-intel
            target: x86_64
            python_version: "3.14"
          - runner: macos-latest
            target: aarch64
            python_version: "3.10"
          - runner: macos-latest
            target: aarch64
            python_version: "3.11"
          - runner: macos-latest
            target: aarch64
            python_version: "3.12"
          - runner: macos-latest
            target: aarch64
            python_version: "3.13"
          - runner: macos-latest
            target: aarch64
            python_version: "3.14"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Update Rust
        run: rustup update stable && rustup default stable

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.platform.python_version }}

      - name: Create virtual environment
        run: python -m venv --upgrade-deps .venv

      - name: Activate virtual environment
        run: |
          echo "VIRTUAL_ENV=$(pwd)/.venv" >> "${GITHUB_ENV}"
          echo "$(pwd)/.venv/bin" >> "${GITHUB_PATH}"

      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter python --locked
          target: ${{ matrix.platform.target }}

      - name: Upload wheels
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.platform.target }}-py${{ matrix.platform.python_version }}
          path: dist
          if-no-files-found: error

  sdist:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --sdist --out dist

      - name: Upload sdist
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheel-smoke:
    name: Smoke test ${{ matrix.artifact }}
    # Smoke tests consume uploaded artifacts, so only run them when this workflow will publish.
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: [linux, windows, macos]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            artifact: wheels-linux-x86_64
          - runner: macos-15-intel
            artifact: wheels-macos-x86_64-py3.13
          - runner: windows-latest
            artifact: wheels-windows-x64-py3.13
    steps:
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Download wheel
        uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: dist

      - name: Install wheel
        run: python -m pip install --no-index --find-links dist sprocket_bio

      - name: Import package
        run: python -c "import sprocket_bio"

  release:
    name: Release
    runs-on: ubuntu-latest
    # Only publish when a new release is made or on demand. This way we don't try to publish when
    # triggered on a pull request.
    if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish) }}
    needs: [linux, musllinux, windows, macos, sdist, wheel-smoke]
    permissions:
      # Used to sign release artifacts and authenticate with trusted publishing.
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/sprocket-bio
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: 'wheels-*'
          path: dist
          merge-multiple: true

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
